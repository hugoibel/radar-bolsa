<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar Bolsa</title>
  <meta name="description" content="Salidas a bolsa, empresas pequeñas con potencial y acciones castigadas de EE.UU., con datos reales y sin humo.">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radar Bolsa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="img/icon-192.png" alt="">
    <div class="marca">
      <b>Radar Bolsa</b>
      <small id="actualizado">Cargando datos…</small>
    </div>
    <button class="icobtn" id="btn-guia" aria-label="Guía">?</button>
  </header>

  <main>
    <div class="instalar" id="instalar">
      <span>📲 Para instalarla en el iPhone: pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.</span>
      <button class="icobtn" id="cerrar-instalar" aria-label="Cerrar">✕</button>
    </div>

    <div class="cargando" id="cargando"><div class="radar"></div><span>Escaneando el mercado…</span></div>

    <section class="vista" id="v-inicio"></section>
    <section class="vista" id="v-ipos"></section>
    <section class="vista" id="v-potencial"></section>
    <section class="vista" id="v-caidas"></section>
    <section class="vista" id="v-buscar"></section>
    <section class="vista" id="v-guia"></section>
  </main>

  <div class="velo" id="velo"></div>
  <div class="hoja" id="hoja" role="dialog" aria-modal="true"></div>

  <nav class="nav" id="nav">
    <button data-v="inicio" class="on"><span class="i">🏠</span>Inicio</button>
    <button data-v="ipos"><span class="i">🚀</span>Salidas</button>
    <button data-v="potencial"><span class="i">🌱</span>Potencial</button>
    <button data-v="caidas"><span class="i">📉</span>Castigadas</button>
    <button data-v="buscar"><span class="i">🔎</span>Buscar</button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
